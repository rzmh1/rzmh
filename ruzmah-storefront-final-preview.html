:root {
  --purple: #7460d4;
  --purple-light: #ece7ff;
  --navy: #25233e;
  --bg: #fbfaf7;
  --surface: #fff;
  --cream: #f2efe7;
  --text: #26243e;
  --muted: #797586;
  --border: #e7e4ed;
  --soft: #f5f3fa;
  --shadow: 0 16px 50px #29214409;
  --radius: 20px;
  --font: Ruzmah, "Tahoma", sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #171623;
  --surface: #222132;
  --cream: #292635;
  --text: #f1edf9;
  --muted: #b1aabd;
  --border: #3a364d;
  --soft: #29263b;
  --purple-light: #383053;
  --navy: #eae5ff;
  --shadow: 0 16px 50px #0002;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
  scroll-padding-top: 110px;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.8;
}
a {
  color: inherit;
  text-decoration: none;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
summary,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: 0.5;
}
a,
button {
  touch-action: manipulation;
}
button {
  color: inherit;
}
button,
input,
select,
textarea {
  border: 1px solid var(--border);
}
input,
select,
textarea {
  background: var(--surface);
  color: var(--text);
  border-radius: 10px;
  padding: 11px 14px;
  width: 100%;
}
textarea {
  resize: vertical;
  min-height: 100px;
}
label {
  display: block;
  font-weight: 600;
  margin-bottom: 7px;
}
input:focus,
select:focus,
textarea:focus {
  outline: 2px solid var(--purple);
  outline-offset: 2px;
}
a:focus-visible,
button:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--purple);
  outline-offset: 5px;
}
h1,
h2,
h3,
h4,
p {
  margin: 0;
}
h1,
h2,
h3 {
  line-height: 1.55;
}
h1 {
  font-size: 44px;
  letter-spacing: -1.5px;
}
h2 {
  font-size: 32px;
  letter-spacing: -0.8px;
}
h3 {
  font-size: 19px;
}
p {
  color: var(--muted);
}
svg {
  flex-shrink: 0;
}
.icon {
  width: 21px;
  height: 21px;
  vertical-align: middle;
}
.container {
  width: min(1200px, calc(100% - 80px));
  margin-inline: auto;
}
.skip {
  position: fixed;
  inset: 10px auto auto 10px;
  padding: 10px;
  background: var(--surface);
  z-index: 999;
  transform: translateY(-150%);
}
.skip:focus {
  transform: none;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  border-radius: 10px;
  padding: 13px 25px;
  font-weight: 600;
  min-height: 49px;
  font-size: 14px;
  white-space: nowrap;
  border: 1px solid transparent;
  transition:
    transform 0.2s,
    background 0.2s;
}
.btn:hover {
  transform: translateY(-2px);
}
.btn-primary {
  background: var(--purple);
  color: #fff;
  box-shadow: 0 6px 18px #7460d424;
}
.btn-dark {
  background: #29263f;
  color: #fff;
}
.btn-outline {
  background: transparent;
  border-color: var(--border);
  color: var(--text);
}
.btn-white {
  background: #fff;
  color: #342950;
}
.btn-light {
  background: var(--purple-light);
  color: var(--text);
}
.btn-sm {
  min-height: 42px;
  padding: 8px 17px;
  font-size: 12px;
}
.btn-ghost {
  background: transparent;
  color: var(--text);
}
.text-link {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: var(--purple);
  font-weight: 600;
}
.icon-btn {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: transparent;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
}
.icon-btn:hover {
  background: var(--soft);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 6px;
  background: var(--soft);
  font-size: 10px;
  padding: 3px 8px;
  white-space: nowrap;
  color: var(--muted);
}
.badge-purple {
  background: var(--purple-light);
  color: var(--purple);
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  color: var(--purple);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 14px;
}
.eyebrow:before {
  content: "";
  width: 20px;
  height: 2px;
  background: var(--purple);
}
.section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 25px;
  margin-bottom: 32px;
}
.section-heading p {
  margin-top: 9px;
  font-size: 13px;
}
.section-space {
  padding-block: 76px;
}
.center {
  text-align: center;
}
.muted {
  color: var(--muted);
}
.site-header {
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
  backdrop-filter: blur(16px);
}
.header-inner {
  height: 90px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  position: relative;
}
.logo > span:not(.logo-mark) {
  font-size: 36px;
  font-weight: 700;
  line-height: 1.3;
  letter-spacing: -2px;
}
.logo-mark {
  color: var(--purple);
}
.logo-mark .icon {
  width: 32px;
  height: 32px;
  stroke-width: 1.9;
}
.logo i {
  font-size: 7px;
  letter-spacing: 3px;
  font-style: normal;
  position: absolute;
  bottom: -10px;
  left: 0;
  color: var(--muted);
}
.logo img {
  max-height: 48px;
  max-width: 150px;
}
nav {
  display: flex;
  align-items: center;
  gap: 32px;
  font-size: 12px;
  font-weight: 500;
}
nav a:hover,
nav summary:hover {
  color: var(--purple);
}
.nav-home {
  color: var(--purple);
}
.nav-dropdown {
  position: relative;
}
.nav-dropdown summary {
  display: flex;
  gap: 8px;
  align-items: center;
  cursor: pointer;
  list-style: none;
}
.nav-dropdown summary::-webkit-details-marker {
  display: none;
}

.hero-v2 .hero-art {

.hero-sequence {

.tracks-v2 .section-card {

  content: "";

  left: -30px;
  bottom: -70px;

  height: 160px;

.tracks-v2 .step-card {

.method-section {

.method-section .section-heading > p {

}
.benefit-grid {

}
.benefit-card {

.benefit-top {

.benefit-top > span {

  height: 42px;

}
.benefit-top small {

    12px Arial,
    sans-serif;

}
.benefit-card h3 {
  font-size: 18px;
}
.benefit-card p {
  font-size: 12px;
  margin-top: 10px;
  line-height: 2;

}
.benefit-link {
  font-size: 10px;
  color: var(--purple);

}
.benefit-link .icon {

}
.ai-panel {

}
.ai-visual {

}

}
.ai-orb .icon {
  width: 39px;
  height: 39px;
  color: #fff;
}
.ai-visual-step {
  display: flex;
  align-items: center;
  gap: 17px;
  padding: 13px 17px;
  border: 1px solid #ffffff17;
  border-radius: 9px;

  margin-top: 10px;

    14px Arial,
    sans-serif;

}
.ai-visual-step > span {

}
.ai-visual > small {

}
.ai-status-note {

}
.price-card {
  border-radius: 17px;

}
.price-card.featured {
  background: linear-gradient(160deg, var(--surface), var(--purple-light));
}
.price-head h3 {
  font-size: 18px;
}
.price {
  margin-top: 29px;
}
.price b {
  font-size: 41px;
}
.price-saving {

}
.price-card .btn {

}
.order-review .btn {

}
.form-error {

}
.form-error:empty {

}
.footer-logout {

}
.lesson-video {

}
.custom-frame {

}
.tutor-layout {

}

}
.conversation-btn {

}
.ai-chat {

}

.live-message.user {

}

}

}

}
.ai-full {

.admin-shell {

}

}

}

}

}

}

}
.admin-overview-title {

  font-size: 11px;

.admin-metrics {

}
#admin-content {

  font-size: 11px;
}
.admin-table-wrap {
  margin-top: 18px;
}
.upload-picker {

  color: var(--muted);

}

}

  margin-left: 10px;
  height: 10px;
}
.upload-progress > span {

    12px Arial,

}
.upload-progress p {
  margin-top: 10px;
  font-size: 11px;

.cm-panel input,

.cm-panel input {

.cm-search label {

.user-detail {

.user-detail-content {
  padding: 0 20px 20px;
}
.user-detail .table-actions {
  display: flex;
}
button,
input,
select,
textarea {
  scroll-margin-top: 110px;
}

  outline: 2px solid var(--purple);
}
.hero-v2 .hero-kicker {
  border: 1px solid #7460d415;

/* Public storefront: editorial learning pages. Account and admin styles remain in styles.css. */
:root {
  --store-purple: #7058cb;
  --store-lilac: #eee8fa;
  --store-ink: #29223d;
  --store-warm: #efe8dc;
  --store-logo-plate: #fcfaf5;
}
:root[data-theme="dark"] {
  --store-purple: #b8a2ff;
  --store-lilac: #342b49;
  --store-ink: #f1ebfa;
  --store-warm: #332d30;

.welcome-layout {
  display: grid;
  grid-template-columns: 0.8fr 1.2fr;
  gap: 45px;
  max-width: 1050px;
  margin: 10px auto;
}
.welcome-layout > aside {
  padding: 35px;
  background: #30263e;
  border-radius: 22px;
  color: #fff;
  align-self: stretch;
}
.welcome-layout aside h2 {
  font-size: 34px;

}

  margin-top: 22px;

  display: block;

    600 45px Arial,
    sans-serif;

  color: #d9c1f7;

  display: inline !important;
  font-size: 17px !important;

  background: #ffffff12;
}

  background: #c6a9ec;
}

  padding: 35px;

  font-size: 25px;
  line-height: 1.8;

.welcome-answers {
  display: grid;
  gap: 12px;
  margin-top: 30px;
  min-height: 230px;
  align-content: start;
}
.welcome-choice {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 17px;
  border: 1px solid var(--border);
  background: var(--soft);
  border-radius: 11px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 400;
  margin: 0;
}
.welcome-choice input {
  width: 18px;
  height: 18px;
  accent-color: var(--purple);
  flex-shrink: 0;
}
.welcome-choice > span {
  flex: 1;
}
.welcome-choice > .icon {
  color: var(--purple);
  opacity: 0;
  width: 17px;
  height: 17px;
}
.welcome-choice:has(input:checked) {
  border-color: var(--purple);
  background: var(--purple-light);
}
.welcome-choice:has(input:checked) > .icon {
  opacity: 1;

.welcome-actions {
  display: flex;
  align-items: center;
  gap: 9px;
  justify-content: space-between;
  margin-top: 32px;
}

  font-size: 12px;
  padding: 12px 18px;
}
.study-days {
  display: flex;

  flex-wrap: wrap;
  margin-top: 10px;
}
.study-days label {
  margin: 0;
  position: relative;
  cursor: pointer;
  font-weight: 400;
}
.study-days input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}
.study-days label > span {
  display: block;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 14px;
  font-size: 12px;
  background: var(--surface);
  min-height: 44px;
}
.study-days input:checked + span {
  background: var(--purple-light);
  border-color: var(--purple);
  color: var(--purple);
}
.study-days input:focus-visible + span {
  outline: 3px solid var(--purple);

/* Storefront and public catalog only. The student workspace keeps its styles. */
.storefront-final section[id],
.store-catalog-page section[id] {
  scroll-margin-top: 108px;
}
.storefront-final .opening-section {
  background:
    radial-gradient(ellipse at 12% 25%, #a68adc12, transparent 52%), var(--bg);
}
.storefront-final .opening-copy > p {
  max-width: 490px;
  font-size: 15px;
  line-height: 2.1;
}
.storefront-final .opening-actions {
  margin-top: 28px;
}
.storefront-final .opening-proof {
  flex-wrap: wrap;
  row-gap: 12px;
}
.store-path-section,
.store-stage-section,
.store-catalog-section,
.store-start-section {
  padding: 85px 0;
}
.store-path-section {
  background: var(--surface);
}
.store-path-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
}
.store-path-card {
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 38px;
  position: relative;
  overflow: hidden;
  min-height: 330px;
  background: var(--bg);
  transition:
    transform 0.2s,
    border-color 0.2s;
}
.store-path-card.quant {
  background: color-mix(in srgb, var(--store-lilac) 70%, var(--surface));
}
.store-path-card.verbal {
  background: color-mix(in srgb, var(--store-warm) 60%, var(--surface));
}
.store-path-card:after {
  content: "";
  position: absolute;
  inset: 35px auto auto -55px;
  border: 1px solid currentColor;
  border-radius: 50%;
  width: 210px;
  height: 210px;
  opacity: 0.06;
  pointer-events: none;
}
.store-path-card:hover {
  transform: translateY(-4px);
  border-color: var(--store-purple);
}
.store-path-card h3 {
  font-size: 29px;
  margin: 10px 0;
}
.store-path-card p {
  max-width: 350px;
  font-size: 14px;
  line-height: 2;
  color: var(--muted);
}
.store-path-icon {
  width: 54px;
  height: 54px;
  border: 1px solid var(--border);
  border-radius: 16px;
  display: grid;
  place-items: center;
  margin-bottom: 25px;
  background: var(--surface);
  color: var(--store-purple);
}
.store-path-tags,
.catalog-skill-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 22px 0;
}
.store-path-tags span,
.catalog-skill-tags span {
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 11px;
}
.store-path-card > b {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 23px;
  font-size: 13px;
}
.stage-comparison {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-radius: 22px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface);
}
.stage-comparison article {
  padding: 35px 40px;
}
.stage-comparison article + article {
  border-inline-start: 1px solid var(--border);
  background: var(--soft);
}
.stage-index {
  font-family: Arial, Ruzmah, sans-serif;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.3px;
}
.stage-comparison h3 {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 25px;
  margin: 24px 0 12px;
}
.stage-comparison h3 .icon {
  color: var(--store-purple);
}
.stage-comparison p {
  font-size: 14px;
  line-height: 2.1;
  color: var(--muted);
  max-width: 450px;
}
.stage-comparison article > span:last-child {
  display: inline-block;
  font-size: 11px;
  margin-top: 22px;
  color: var(--store-purple);
}
.stage-comparison-note {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
  margin-top: 22px;
}
.store-catalog-section {
  background: var(--surface);
}
.store-source-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin: 36px 0 22px;
}
.store-source-heading:first-child {
  margin-top: 0;
}
.store-source-heading h2 {
  font-size: 24px;
}
.store-source-heading h3 {
  font-size: 17px;
}
.store-source-heading p {
  color: var(--muted);
  font-size: 13px;
  line-height: 2;
  margin-top: 8px;
}
.store-teacher-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.store-teacher {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 23px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--bg);
  transition:
    border-color 0.2s,
    box-shadow 0.2s;
  min-width: 0;
}
.store-teacher:hover {
  border-color: var(--store-purple);
  box-shadow: 0 8px 25px #20163808;
}
.store-teacher > div:nth-child(2) {
  min-width: 0;
  flex: 1;
}
.store-teacher > .icon {
  width: 16px;
  flex-shrink: 0;
  color: var(--store-purple);
}
.store-teacher h3 {
  font-size: 19px;
  margin: 5px 0;
}
.store-teacher small {
  font-size: 10px;
  color: var(--muted);
  display: block;
}
.store-teacher p {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 11px;
  line-height: 1.9;
  color: var(--muted);
}
.store-teacher div > span:last-child {
  display: block;
  font-size: 10px;
  margin-top: 11px;
  color: var(--muted);
  line-height: 1.8;
}
.store-teacher-photo {
  width: 62px;
  height: 72px;
  border-radius: 35px 35px 17px 17px;
  background: var(--purple-light);
  color: var(--store-purple);
  position: relative;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.store-teacher-photo > span {
  font-size: 30px;
  font-weight: 700;
  margin: 0 !important;
  color: inherit !important;
}
.store-teacher-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}
.store-teacher-photo i {
  position: absolute;
  bottom: -4px;
  left: -4px;
  border: 3px solid var(--surface);
  background: var(--store-purple);
  color: var(--surface);
  border-radius: 50%;
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
}
.store-teacher-photo i .icon {
  width: 12px;
  height: 12px;
}
.catalog-empty-inline {
  display: flex;
  gap: 18px;
  align-items: center;
  background: var(--bg);
  border: 1px dashed var(--border);
  padding: 25px;
  border-radius: 16px;
  color: var(--muted);
  font-size: 13px;
  line-height: 2;
}
.catalog-course-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
}
.catalog-course {
  border-radius: 18px;
  border: 1px solid var(--border);
  overflow: hidden;
  background: var(--surface);
  min-width: 0;
  box-shadow: 0 6px 24px #29223d04;
  transition:
    box-shadow 0.2s,
    transform 0.2s;
}
.catalog-course[hidden] {
  display: none;
}
.catalog-course:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 35px #29223d0b;
}
.catalog-course-art {
  display: block;
  position: relative;
}
.catalog-course-art .course-art {
  height: 205px;
}
.catalog-stage {
  position: absolute;
  top: 16px;
  right: 16px;
  padding: 5px 12px;
  background: #fff9;
  color: #26243e;
  backdrop-filter: blur(10px);
  border: 1px solid #fff8;
  border-radius: 6px;
  font-size: 11px;
}
.catalog-course-body {
  padding: 23px;
}
.catalog-course-body > small {
  font-size: 10px;
  color: var(--muted);
}
.catalog-course-body h3 {
  font-size: 21px;
  margin: 8px 0 12px;
  line-height: 1.7;
}
.catalog-teacher {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--store-purple);
}
.catalog-teacher .icon {
  width: 14px;
  height: 14px;
}
.catalog-course-body > p {
  font-size: 12px;
  line-height: 2;
  color: var(--muted);
  margin: 14px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.catalog-course-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  padding: 16px 0;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--muted);
}
.catalog-course-meta span {
  display: flex;
  align-items: center;
  gap: 5px;
}
.catalog-course-meta .icon {
  width: 14px;
  height: 14px;
}
.catalog-card-bottom {
  display: flex;
  gap: 10px;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border);
  padding-top: 18px;
}
.catalog-card-bottom .text-link {
  font-size: 11px;
  gap: 8px;
}
.catalog-card-bottom > span {
  font-size: 9px;
  color: var(--muted);
}
.catalog-demo {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 14px;
}
.catalog-preview-note,
.catalog-course-assurance {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  line-height: 2;
  color: var(--muted);
  margin-top: 26px;
}
.store-benefits {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}
.store-benefits article {
  padding: 30px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--surface);
  min-width: 0;
}
.store-benefits h3 {
  font-size: 23px;
  line-height: 1.8;
  margin: 15px 0 12px;
}
.store-benefits p {
  font-size: 12px;
  line-height: 2;
  color: var(--muted);
}
.store-benefits .eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
}
.store-benefits .eyebrow .icon {
  width: 17px;
  height: 17px;
}
.store-benefits .benefit-ai {
  grid-column: span 2;
  background: #2c2542;
  color: #f6f0ff;
  padding: 38px;
  position: relative;
  overflow: hidden;
}
.benefit-ai h3 {
  font-size: 32px;
  position: relative;
}
.benefit-ai .eyebrow {
  color: #c5b2ff;
}
.benefit-ai p {
  color: #d3c9e5;
  max-width: 430px;
}
.benefit-ai > small {
  font-size: 10px;
  color: #d3c9e5;
}
.benefit-flow {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 26px 0;
  font-size: 12px;
  flex-wrap: wrap;
  color: #f1e9ff;
}
.benefit-flow span {
  padding: 9px 15px;
  border: 1px solid #ffffff29;
  border-radius: 9px;
  background: #ffffff08;
}
.benefit-flow .icon {
  width: 16px;
  color: #b39be6;
}
.store-benefits .benefit-bank {
  background: var(--purple-light);
}
.benefit-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 25px;
  font-size: 10px;
}
.benefit-chips span {
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 7px;
  background: var(--surface);
}
.store-benefits .benefit-errors {
  grid-column: span 3;
  display: flex;
  align-items: center;
  gap: 24px;
  background: color-mix(in srgb, var(--store-warm) 60%, var(--surface));
  padding: 25px 32px;
}
.benefit-errors > span {
  width: 55px;
  height: 65px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 12px;
  display: grid;
  place-items: center;
  transform: rotate(-6deg);
  color: var(--store-purple);
  flex-shrink: 0;
}
.benefit-errors h3 {
  margin: 0 0 5px;
  font-size: 22px;
}
.benefit-scribble {
  width: 100%;
  height: 50px;
  margin-top: 20px;
  color: var(--store-purple);
}
.benefits-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-top: 28px;
  font-size: 12px;
  color: var(--muted);
}
.store-start-section {
  background: var(--surface);
}
.store-start-steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 40px;
}
.store-start-steps article {
  border-top: 1px solid var(--border);
  padding-top: 23px;
  position: relative;
}
.store-start-steps article > span {
  display: block;
  color: var(--store-purple);
  font:
    28px/1.3 Georgia,
    serif;
  margin-bottom: 20px;
}
.store-start-steps h3 {
  font-size: 23px;
  margin: 12px 0;
}
.store-start-steps p {
  font-size: 13px;
  color: var(--muted);
  line-height: 2;
  max-width: 320px;
  min-height: 80px;
}
.store-start-steps a {
  margin-top: 18px;
  font-size: 12px;
}
.footer-email {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  font-size: 12px;
  margin-top: 12px;
  color: var(--store-purple);
}
.footer-email .icon {
  width: 16px;
  height: 16px;
}
/* Public section, teacher and course pages share the store identity. */
.store-catalog-page {
  padding: 10px 0 50px;
}
.store-catalog-page .catalog-intro {
  max-width: 850px;
  margin: 38px 0 45px;
}
.store-catalog-page h1 {
  font-size: clamp(32px, 3.5vw, 48px);
  line-height: 1.6;
  letter-spacing: -1px;
}
.catalog-intro > p,
.catalog-intro > div > p,
.catalog-course-intro > div > p {
  font-size: 15px;
  line-height: 2.1;
  color: var(--muted);
  margin-top: 18px;
  max-width: 670px;
}
.catalog-intro-split {
  display: grid;
  grid-template-columns: 1fr 130px;
  gap: 40px;
  align-items: center;
  max-width: none !important;
}
.catalog-section-symbol {
  width: 125px;
  height: 125px;
  background: var(--purple-light);
  color: var(--store-purple);
  border-radius: 30px;
  display: grid;
  place-items: center;
  transform: rotate(-7deg);
}
.catalog-section-symbol .icon {
  width: 65px;
  height: 65px;
}
.catalog-subsection {
  margin-top: 55px;
}
.catalog-subsection > h2 {
  font-size: 24px;
  margin-bottom: 22px;
}
.catalog-track-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 18px;
}
.catalog-track-grid > a {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 25px;
  border-radius: 16px;
  transition: border-color 0.2s;
}
.catalog-track-grid > a:hover {
  border-color: var(--store-purple);
}
.catalog-track-grid > a > span {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  background: var(--purple-light);
  color: var(--store-purple);
  border-radius: 11px;
}
.catalog-track-grid h3 {
  font-size: 21px;
  margin: 19px 0 12px;
}
.catalog-track-grid p {
  font-size: 12px;
  line-height: 2;
  color: var(--muted);
}
.catalog-track-grid b {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
  font-size: 12px;
  color: var(--store-purple);
}
.catalog-coming {
  padding: 55px;
  border: 1px solid var(--border);
  border-radius: 22px;
  text-align: center;
  background: var(--surface);
}
.catalog-coming h2 {
  font-size: 30px;
  margin: 20px 0;
}
.catalog-coming p {
  max-width: 530px;
  font-size: 14px;
  line-height: 2;
  color: var(--muted);
  margin: 0 auto 25px;
}
.catalog-filter-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.catalog-filter {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 20px;
  min-height: 44px;
  font: inherit;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
}
.catalog-filter.active {
  background: var(--purple-light);
  border-color: var(--store-purple);
  color: var(--store-purple);
}
.catalog-search {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  padding: 0 18px;
  max-width: 500px;
}
.catalog-search input {
  border: 0 !important;
  background: transparent;
  min-width: 0;
}
.catalog-search .icon {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  color: var(--muted);
}
.catalog-teacher-intro {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 35px;
  margin: 35px 0;
}
.catalog-teacher-intro .store-teacher {
  padding: 30px;
  pointer-events: none;
}
.catalog-teacher-intro .store-teacher p {
  display: none;
}
.catalog-teacher-intro .store-teacher > .icon {
  display: none;
}
.catalog-teacher-intro .store-teacher h3 {
  font-size: 31px;
}
.catalog-teacher-intro .store-teacher-photo {
  width: 110px;
  height: 130px;
}
.catalog-teacher-about {
  padding: 22px 0;
}
.catalog-teacher-about p {
  line-height: 2;
  color: var(--muted);
  font-size: 14px;
  white-space: pre-line;
}
.catalog-course-intro {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: 55px;
  align-items: center;
  margin: 40px 0;
}
.catalog-course-intro > .course-art {
  height: 305px;
  border-radius: 22px;
}
.catalog-course-intro .hero-actions {
  margin: 26px 0 14px;
  flex-wrap: wrap;
}
.catalog-course-intro small {
  color: var(--muted);
  font-size: 11px;
  line-height: 2;
  display: block;
}
.catalog-course-intro .catalog-teacher {
  margin-top: 15px;
}
.catalog-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 16px;
  margin: 35px 0;
}
.catalog-metrics > div {
  padding: 25px;
  text-align: center;
  min-width: 0;
}
.catalog-metrics > div + div {
  border-inline-start: 1px solid var(--border);
}
.catalog-metrics b {
  display: block;
  font-size: 27px;
  line-height: 1.5;
  font-family: Arial, Ruzmah, sans-serif;
  font-weight: 500;
}
.catalog-metrics span {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.9;
}
.store-lesson-list {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
}
.store-lesson-row {
  display: grid;
  grid-template-columns: 35px 1fr auto 32px;
  gap: 18px;
  align-items: center;
  padding: 23px 25px;
  transition: background 0.2s;
  min-width: 0;
}
.store-lesson-row + .store-lesson-row {
  border-top: 1px solid var(--border);
}
.store-lesson-row.is-preview {
  background: var(--purple-light);
}
.store-lesson-row:hover {
  background: var(--soft);
}
.store-lesson-row.is-selected {
  box-shadow: inset -3px 0 var(--store-purple);
}
.store-lesson-number {
  font:
    13px Arial,
    sans-serif;
  color: var(--muted);
}
.store-lesson-row > div {
  min-width: 0;
}
.store-lesson-row h3 {
  font-size: 16px;
  line-height: 1.8;
}
.store-lesson-row small,
.lesson-file-titles {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.8;
}
.store-lesson-time {
  font:
    12px/1.8 Arial,
    Ruzmah,
    sans-serif;
  color: var(--muted);
  text-align: center;
  max-width: 130px;
}
.store-lesson-lock {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  color: var(--store-purple);
}
.store-lesson-lock .icon {
  width: 18px;
  height: 18px;
}
.catalog-preview-gate,
.catalog-preview-player {
  border: 1px solid var(--border);
  border-radius: 20px;
  margin: 35px 0;
  background: var(--surface);
  padding: 35px;
}
.catalog-preview-gate {
  text-align: center;
  padding: 45px 30px;
  background: linear-gradient(120deg, var(--purple-light), var(--surface));
}
.catalog-preview-gate .hero-actions {
  justify-content: center;
  flex-wrap: wrap;
  margin: 24px 0;
}
.catalog-preview-gate > p {
  font-size: 14px;
  line-height: 2;
  max-width: 620px;
  margin: 15px auto;
  color: var(--muted);
}
.catalog-preview-gate h2 {
  font-size: 27px;
  line-height: 1.7;
  margin-top: 14px;
}
.catalog-preview-gate small {
  font-size: 11px;
  color: var(--muted);
}
.preview-gate-icon {
  width: 65px;
  height: 65px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  display: grid;
  place-items: center;
  color: var(--store-purple);
  margin: 0 auto 25px;
}
.preview-player-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
}
.preview-player-heading h2 {
  font-size: 24px;
  margin-top: 12px;
}
.preview-player-heading > span {
  color: var(--muted);
  font-size: 12px;
}
.store-preview-video {
  width: 100%;
  max-height: 65vh;
  aspect-ratio: 16/9;
  display: block;
  background: #191524;
  border-radius: 12px;
}
.preview-reading {
  border-radius: 12px;
  background: var(--bg);
  padding: 30px;
  white-space: pre-line;
  font-size: 15px;
  line-height: 2.2;
}
.preview-reading blockquote {
  padding: 20px;
  border-inline-start: 3px solid var(--purple);
  margin-top: 20px;
}
.preview-processing {
  padding: 45px;
  border-radius: 12px;
  background: var(--soft);
  font-size: 14px;
  line-height: 2;
  text-align: center;
}
.preview-upsell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
  border-top: 1px solid var(--border);
  padding-top: 24px;
  margin-top: 24px;
  font-size: 12px;
  line-height: 2;
  color: var(--muted);
}
.preview-files {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  margin-top: 20px;
}
.preview-files a {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--store-purple);
}
#preview-feedback {
  font-size: 13px;
  color: var(--muted);
  margin-top: 15px;
  line-height: 2;
}
.store-admin-section {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
}
.store-admin-section summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-size: 14px;
  min-height: 44px;
}
.store-admin-section[open] summary {
  margin-bottom: 20px;
}
.store-admin-faq-row {
  border-bottom: 1px solid var(--border);
  padding: 15px 0 25px;
}
.store-admin-faq-row .field {
  margin-top: 14px;
}
.store-admin-faq-row button {
  margin-top: 10px;
}
#store-content-form fieldset {
  border: 1px solid var(--border);
  padding: 20px;
  border-radius: 12px;
  max-height: 350px;
  overflow: auto;
}
#store-content-form .checkbox {
  margin: 12px 0;
}
@media (max-width: 1100px) {
  .store-teacher-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .store-teacher-grid > :last-child:nth-child(odd) {
    grid-column: span 2;
  }
  .site-header #main-nav {
    display: none;
    position: absolute;
    top: 78px;
    right: 24px;
    left: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 14px;
    box-shadow: 0 18px 45px #29213b15;
    align-items: stretch;
    gap: 0;
    max-height: calc(100dvh - 110px);
    overflow: auto;
  }
  .site-header #main-nav.open {
    display: flex;
    flex-direction: column;
  }
  .site-header #main-nav > a,
  .site-header #main-nav summary {
    padding: 13px 14px;
    font-size: 13px;
    min-height: 48px;
  }
  .site-header .dropdown-panel {
    position: static;
    min-width: initial;
    margin: 0 10px;
    box-shadow: none;
  }
  .site-header .header-inner {
    height: 78px;
  }
  .site-header .mobile-toggle {
    display: flex;
    min-width: 44px;
    min-height: 44px;
    border: 0;
  }
  .site-header .nav-auth-link {
    display: block !important;
    border-top: 1px solid var(--border);
    margin-top: 7px;
    color: var(--purple);
  }
  .site-header .login-link {
    display: none;
  }
  .catalog-course-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .catalog-course-intro {
    gap: 30px;
  }
}
@media (max-width: 760px) {
  .store-path-section,
  .store-stage-section,
  .store-catalog-section,
  .store-start-section {
    padding: 55px 0;
  }
  .store-path-card {
    padding: 28px;
  }
  .store-path-card h3 {
    font-size: 25px;
  }
  .stage-comparison article {
    padding: 25px;
  }
  .store-benefits {
    grid-template-columns: 1fr 1fr;
  }
  .store-benefits .benefit-ai,
  .store-benefits .benefit-errors {
    grid-column: span 2;
  }
  .store-benefits .benefit-bank {
    grid-column: span 2;
  }
  .store-start-steps {
    gap: 24px;
  }
  .store-start-steps h3 {
    font-size: 19px;
  }
  .catalog-course-intro {
    grid-template-columns: 1fr;
  }
  .catalog-course-intro > .course-art {
    height: 240px;
    order: 2;
  }
  .catalog-course-intro h1 {
    font-size: 35px;
  }
  .catalog-teacher-intro {
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .catalog-coming {
    padding: 35px 24px;
  }
}
@media (max-width: 560px) {
  .storefront-final .opening-copy > p {
    font-size: 14px;
  }
  .store-path-grid,
  .stage-comparison,
  .store-start-steps,
  .catalog-course-grid,
  .store-teacher-grid {
    grid-template-columns: 1fr;
  }
  .store-teacher-grid > :last-child:nth-child(odd) {
    grid-column: auto;
  }
  .store-path-card {
    min-height: 0;
    padding: 28px;
  }
  .store-path-card p {
    font-size: 13px;
  }
  .stage-comparison article + article {
    border-inline-start: 0;
    border-top: 1px solid var(--border);
  }
  .stage-comparison p {
    font-size: 13px;
  }
  .stage-comparison-note {
    align-items: start;
    line-height: 1.9;
    text-align: center;
    font-size: 11px;
  }
  .stage-comparison-note .icon {
    flex-shrink: 0;
  }
  .store-source-heading {
    align-items: start;
    gap: 14px;
  }
  .store-source-heading h3 {
    font-size: 15px;
    line-height: 1.8;
    max-width: 210px;
  }
  .store-source-heading .text-link {
    font-size: 10px;
    white-space: nowrap;
    gap: 6px;
  }
  .store-source-heading .text-link .icon {
    width: 14px;
  }
  .store-benefits {
    grid-template-columns: 1fr;
  }
  .store-benefits article,
  .store-benefits .benefit-ai,
  .store-benefits .benefit-bank,
  .store-benefits .benefit-errors {
    grid-column: auto;
    padding: 26px;
  }
  .store-benefits .benefit-ai h3 {
    font-size: 27px;
  }
  .store-benefits .benefit-errors {
    align-items: start;
    gap: 16px;
  }
  .benefit-errors h3 {
    font-size: 20px;
  }
  .benefits-foot {
    align-items: start;
    flex-direction: column;
    line-height: 2;
  }
  .benefits-foot .btn {
    width: 100%;
  }
  .store-start-steps article {
    padding: 25px 0 10px;
  }
  .store-start-steps p {
    min-height: 0;
    max-width: none;
  }
  .store-start-steps article > span {
    font-size: 25px;
    margin-bottom: 12px;
  }
  .catalog-intro-split {
    grid-template-columns: 1fr 60px;
    gap: 15px;
  }
  .catalog-section-symbol {
    width: 60px;
    height: 70px;
    border-radius: 15px;
  }
  .catalog-section-symbol .icon {
    width: 35px;
    height: 35px;
  }
  .catalog-metrics > div {
    padding: 18px 8px;
  }
  .catalog-metrics b {
    font-size: 21px;
  }
  .catalog-metrics span {
    font-size: 9px;
  }
  .catalog-preview-note,
  .catalog-course-assurance {
    align-items: start;
    font-size: 11px;
    text-align: start;
  }
  .catalog-preview-note .icon,
  .catalog-course-assurance .icon {
    flex-shrink: 0;
    width: 16px;
  }
  .store-lesson-row {
    grid-template-columns: 23px 1fr 26px;
    gap: 10px;
    padding: 20px 16px;
  }
  .store-lesson-row h3 {
    font-size: 14px;
  }
  .store-lesson-row small {
    font-size: 9px;
  }
  .store-lesson-time {
    grid-column: 2;
    grid-row: auto;
    text-align: start;
    font-size: 11px;
    max-width: none;
  }
  .store-lesson-lock {
    grid-column: 3;
    grid-row: 1 / span 2;
  }
  .catalog-preview-gate,
  .catalog-preview-player {
    padding: 25px 18px;
    border-radius: 16px;
  }
  .catalog-preview-gate h2 {
    font-size: 23px;
  }
  .catalog-preview-gate .hero-actions .btn {
    width: 100%;
    min-height: 48px;
  }
  .preview-reading {
    padding: 20px;
    font-size: 14px;
  }
  .preview-player-heading h2 {
    font-size: 20px;
  }
  .preview-upsell {
    flex-direction: column;
    align-items: stretch;
    gap: 16px;
  }
  .preview-upsell .btn {
    width: 100%;
  }
  .catalog-coming h2 {
    font-size: 25px;
  }
  .catalog-course-intro .hero-actions .btn {
    width: 100%;
    min-height: 48px;
  }
  .catalog-course-intro h1 {
    font-size: 31px;
  }
  .catalog-teacher-intro .store-teacher {
    padding: 24px;
  }
  .catalog-teacher-intro .store-teacher h3 {
    font-size: 25px;
  }
  .catalog-teacher-intro .store-teacher-photo {
    width: 80px;
    height: 100px;
  }
  .store-catalog-page input {
    font-size: 16px;
  }
}
@media (max-width: 360px) {
  .site-header .header-actions {
    gap: 5px;
  }
  .site-header .header-actions > .btn {
    font-size: 10px;
    padding: 10px;
  }
  .site-header .header-actions > .btn > .icon {
    display: none;
  }
  .storefront-final .opening-copy h1 {
    font-size: 34px;
  }
  .store-catalog-page h1 {
    font-size: 29px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .store-path-card,
  .catalog-course,
  .store-teacher,
  .store-lesson-row {
    transition: none;
  }
  .store-path-card:hover,
  .catalog-course:hover {
    transform: none;
  }
}

.store-catalog-page a:focus-visible,
.store-catalog-page button:focus-visible {
  outline: 3px solid var(--store-purple);
  outline-offset: 4px;
}
.store-catalog-page .btn {
  min-height: 48px;
}
.catalog-card-bottom .text-link {
  min-height: 44px;
}
.catalog-teacher-intro .store-teacher h1 {
  font-size: 31px;
}
@media (max-width: 560px) {
  .site-header .header-inner {
    gap: 10px;
  }
  .site-header .header-actions {
    gap: 6px;
  }
  .site-header .theme-toggle {
    min-width: 44px;
  }
  .site-header .header-actions > .btn > .icon {
    display: none;
  }
  .catalog-teacher-intro .store-teacher h1 {
    font-size: 25px;
  }
}
@media (max-width: 360px) {
  .site-header .header-actions > .btn {
    display: none;
  }
}

.store-teacher .store-teacher-photo > span {
  font-size: 30px !important;
}
#store-content-form label > input,
#store-content-form label > textarea {
  display: block;
  margin-top: 8px;
}

.store-catalog-page,
.storefront-final h1,
.storefront-final h2,
.storefront-final h3 {
  overflow-wrap: anywhere;
}
@media (max-width: 560px) {
  .site-header .logo img {
    max-width: 115px;
    height: 45px;
  }
}

  function mountCatalog() {
    const click = (ev) => {
      const b = ev.target.closest("[data-store-stage]");
      if (!b) return;
      document.querySelectorAll("[data-store-stage]").forEach((x) => {
        x.classList.toggle("active", x === b);
        x.setAttribute("aria-pressed", String(x === b));
      });
      const cards = [
        ...document.querySelectorAll("#catalog-course-list .catalog-course")
      ];
      for (const card of cards) {
        const id = card.querySelector("a").getAttribute("href").split("/")[2], course = db.courses.find((c) => c.id === id);
        card.hidden = b.dataset.storeStage !== "all" && course?.stage !== b.dataset.storeStage;
      }
      document.querySelector("#catalog-filter-empty")?.classList.toggle(
        "hidden",
        cards.some((c) => !c.hidden)
      );
    };
    const input = (ev) => {
      if (ev.target.id !== "store-teacher-search") return;
      const query = ev.target.value.trim().toLocaleLowerCase("ar"), teachers = (db.instructors || []).filter(
        (t) => t.published && !t.deleted && [t.name, t.specialty, t.bio].join(" ").toLocaleLowerCase("ar").includes(query)
      );
      document.querySelector("#store-teacher-list").innerHTML = teachers.map(publicTeacherCard).join("");
      document.querySelector("#store-teacher-empty").classList.toggle("hidden", !!teachers.length);
    };
    const video = document.querySelector(".store-preview-video"), error = () => {
      const t = document.querySelector("#preview-feedback");
      if (t)
        t.textContent = "\u062A\u0639\u0630\u0631 \u062A\u0634\u063A\u064A\u0644 \u0627\u0644\u0641\u064A\u062F\u064A\u0648. \u062A\u062D\u0642\u0642 \u0645\u0646 \u0627\u0644\u0627\u062A\u0635\u0627\u0644 \u0648\u0635\u0644\u0627\u062D\u064A\u0629 \u062D\u0633\u0627\u0628\u0643\u060C \u062B\u0645 \u0623\u0639\u062F \u062A\u062D\u0645\u064A\u0644 \u0627\u0644\u062F\u0648\u0631\u0629.";
    };
    video?.addEventListener("error", error);
    document.addEventListener("click", click);
    document.addEventListener("input", input);
    return () => {
      document.removeEventListener("click", click);

      video?.removeEventListener("error", error);

      amount: (base - total) / 100,
      percent: base > 0 ? (base - total) / base * 100 : 0,
      base: base / 100
    };
  }

          "\u0627\u0644\u062C\u062F\u064A\u062F \u064A\u0628\u062F\u0623 \u0645\u0646 \u0647\u0646\u0627.",
          "\u062A\u0638\u0647\u0631 \u0627\u0644\u062A\u062D\u062F\u064A\u062B\u0627\u062A \u0639\u0646\u062F \u0646\u0634\u0631\u0647\u0627 \u0645\u0646 \u0627\u0644\u0625\u062F\u0627\u0631\u0629\u060C \u0645\u0639 \u062A\u0627\u0631\u064A\u062E\u0647\u0627 \u0627\u0644\u0641\u0639\u0644\u064A. \u0644\u0627 \u064A\u0648\u062C\u062F \u0645\u062D\u062A\u0648\u0649 \u0645\u0646\u0634\u0648\u0631 \u062D\u0627\u0644\u064A\u064B\u0627."
        ],

          "\u062A\u0638\u0647\u0631 \u0627\u0644\u0627\u062E\u062A\u0628\u0627\u0631\u0627\u062A \u0627\u0644\u0645\u0631\u062A\u0628\u0637\u0629 \u0628\u062A\u062D\u062F\u064A\u062B \u0645\u0646\u0634\u0648\u0631 \u0647\u0646\u0627. \u0644\u0645 \u064A\u064F\u0646\u0634\u0631 \u0627\u062E\u062A\u0628\u0627\u0631 \u062A\u062D\u062F\u064A\u062B\u0627\u062A \u0628\u0639\u062F."
        ],
        weekly: [
          "\u0627\u0644\u0623\u0641\u0643\u0627\u0631 \u0627\u0644\u0645\u062A\u0643\u0631\u0631\u0629 \u062A\u0633\u062A\u062D\u0642 \u0627\u0646\u062A\u0628\u0627\u0647\u0643.",
          "\u0644\u0645 \u064A\u064F\u0646\u0634\u0631 \u0645\u0644\u062E\u0635 \u0644\u0644\u0623\u0633\u0626\u0644\u0629 \u0627\u0644\u0623\u0643\u062B\u0631 \u062A\u0643\u0631\u0627\u0631\u064B\u0627 \u0647\u0630\u0627 \u0627\u0644\u0623\u0633\u0628\u0648\u0639 \u0628\u0639\u062F."

      const save = savings(p);
      return `<article class="membership-duration"><div class="duration-name"><h3>${escape(p.title)}</h3><span>${save.amount > 0 ? `\u062A\u0648\u0641\u064A\u0631 ${formatPercent(save.percent)}` : "\u0628\u062F\u0627\u064A\u0629 \u0645\u0631\u0646\u0629"}</span></div><div class="duration-price"><b dir="ltr">${money(p.price)}</b><span>\u0631\u064A\u0627\u0644<small>\u0644\u0643\u0627\u0645\u0644 \u0627\u0644\u0645\u062F\u0629</small></span></div><a class="duration-cta" href="#/subscription/${p.id}" aria-label="\u0627\u0644\u0627\u0634\u062A\u0631\u0627\u0643 \u0644\u0645\u062F\u0629 ${escape(p.title)} \u0628\u0633\u0639\u0631 ${money(p.price)} \u0631\u064A\u0627\u0644">\u0627\u0634\u062A\u0631\u0643 ${icon("arrow")}</a>${save.amount > 0 ? `<div class="duration-saving">\u062A\u0648\u0641\u0631 ${money(save.amount)} \u0631\u064A\u0627\u0644 \u0645\u0642\u0627\u0631\u0646\u0629 \u0628\u0627\u0644\u0633\u0639\u0631 \u0627\u0644\u0634\u0647\u0631\u064A.</div>` : ""}</article>`;

  function mountStorefront() {
    const click = (ev) => {
      const feed = ev.target.closest("[data-feed-filter]");
      if (feed) {
        document.querySelectorAll("[data-feed-filter]").forEach((b) => {
          b.classList.toggle("active", b === feed);
          b.setAttribute("aria-pressed", b === feed);
        });
        const target = document.querySelector("#daily-feed-panel");
        if (target)
          target.innerHTML = updateRows(
            feed.dataset.feedFilter,
            document.querySelector(".daily-hub-full") ? Infinity : 3
          );
      }
      const course = ev.target.closest("[data-course-preview]");
      if (course) {
        document.querySelectorAll("[data-course-preview]").forEach((b) => {
          b.classList.toggle("active", b === course);
          b.setAttribute("aria-selected", b === course);
          b.tabIndex = b === course ? 0 : -1;
        });
        const target = document.querySelector("#course-spotlight");
        if (target) {
          target.innerHTML = coursePreview(course.dataset.coursePreview);
          target.setAttribute("aria-labelledby", course.id);
        }
      }
    };
    const keydown = (ev) => {
      const tab = ev.target.closest("[data-course-preview]");
      if (!tab || ![
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp",
        "ArrowDown",
        "Home",
        "End"
      ].includes(ev.key))
        return;
      ev.preventDefault();
      const tabs = [...document.querySelectorAll("[data-course-preview]")], index = tabs.indexOf(tab), next = ev.key === "Home" ? 0 : ev.key === "End" ? tabs.length - 1 : (index + (["ArrowLeft", "ArrowDown"].includes(ev.key) ? 1 : -1) + tabs.length) % tabs.length;
      tabs[next].focus();
      tabs[next].click();
    };
    document.addEventListener("click", click);
    document.addEventListener("keydown", keydown);
    return () => {
      document.removeEventListener("click", click);
      document.removeEventListener("keydown", keydown);
    };
  }

  function mountDrawing(toast2) {
    const canvas = document.querySelector("#scratch-canvas");
    if (!canvas) return () => {
    };
    const ctx = canvas.getContext("2d");
    let strokes = account.user ? student.drawing || [] : read("ruzmah-drawing-v1", []), active = null;
    const color = document.querySelector("#pen-color"), size = document.querySelector("#pen-size");
    const paint = () => {
      const dpr = window.devicePixelRatio || 1, rect = canvas.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (const s of strokes) {
        ctx.strokeStyle = s.color;
        ctx.fillStyle = s.color;
        ctx.lineWidth = s.size;
        ctx.beginPath();
        s.points.forEach((p, i) => {
          let x = p.x * rect.width, y = p.y * rect.height;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        if (s.points.length === 1) {
          const p = s.points[0];
          ctx.arc(
            p.x * rect.width,
            p.y * rect.height,
            s.size / 2,
            0,
            Math.PI * 2
          );
          ctx.fill();
        } else ctx.stroke();
      }
    };
    const point = (ev) => {
      let r = canvas.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)),
        y: Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height))
      };
    };
    const save = () => {
      try {
        if (account.user) {
          student.drawing = strokes;
          void api("/api/student/drawing", {
            method: "PUT",
            body: { strokes }
          }).catch((err) => toast2(err.message));
        } else localStorage.setItem("ruzmah-drawing-v1", JSON.stringify(strokes));
      } catch {
        toast2("\u0645\u0633\u0627\u062D\u0629 \u0627\u0644\u062A\u062E\u0632\u064A\u0646 \u0645\u0645\u062A\u0644\u0626\u0629. \u0627\u062D\u0641\u0638 \u0627\u0644\u0645\u0633\u0648\u062F\u0629 \u0643\u0635\u0648\u0631\u0629.");
      }
    };
    canvas.onpointerdown = (ev) => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      active = {
        color: color.value,
        size: Number(size.value),
        points: [point(ev)],
        pointer: ev.pointerId
      };
      strokes.push(active);
      canvas.setPointerCapture(ev.pointerId);
      paint();
    };
